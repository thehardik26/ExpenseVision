services:
  - type: web
    name: expensevision
    env: python
    region: singapore
    plan: free
    branch: main
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: gunicorn expensevision.wsgi:application
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: GEMINI_API_KEY
        sync: false
