<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="sparkle-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg-grad)" filter="url(#glow)" />
  
  <!-- Subtle border highlight -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="15.5" stroke="#A78BFA" stroke-width="1.2" stroke-opacity="0.4" />

  <!-- Rupee Symbol ₹ -->
  <!-- Top horizontal bar -->
  <path d="M20 18 H40" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
  <!-- Middle horizontal bar -->
  <path d="M20 25 H38" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
  <!-- Vertical stem & curved bowl -->
  <path d="M26 18 V33 H31 C36 33 37 25 31 25" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Downward diagonal leg -->
  <path d="M27 33 L38 48" stroke="#FFFFFF" stroke-width="4.2" stroke-linecap="round" />

  <!-- AI Vision Sparkle (Top-right) -->
  <path d="M48 10 C48 14 52 14 52 14 C52 14 48 14 48 18 C48 14 44 14 44 14 C44 14 48 14 48 10 Z" fill="url(#sparkle-grad)" />
  <circle cx="53" cy="20" r="1.5" fill="#34D399" />
</svg>
